services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azfreight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-azfreight}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azfreight}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/justceo/az_freight-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  frontend:
    image: ghcr.io/justceo/az_freight-frontend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
