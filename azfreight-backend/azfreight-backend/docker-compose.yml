version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: azfreight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: azfreight
      POSTGRES_PASSWORD: azfreight_secret
      POSTGRES_DB: azfreight
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
